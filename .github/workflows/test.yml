name: Use Shared Action to Test

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  run_tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node_version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - uses: jabez007/create-node-template/.github/shared/node/test@master
        with:
          node_version: ${{ matrix.node_version }}

  check_package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - run: npm ci

      # Packs the build and loads it with require() and import, and type-checks it
      # under node16, nodenext, and bundler
      - run: npm run check:package
